<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEEP CAST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-phase="title">
<canvas id="bg"></canvas>
<div id="stage"><div id="shake">
  <div id="oceanFrame"></div>
  <canvas id="ocean" width="224" height="230"></canvas>
  <canvas id="fx" width="1280" height="720"></canvas>

  <div id="left" class="panel">
    <div id="dayBox">
      <div id="dayName" class="t">Day 1</div>
      <div id="zoneLine" class="t"></div>
      <div id="eventLine"></div>
      <div id="quotaRow"><div class="lbl">Quota</div><div id="quota" class="t">0</div></div>
    </div>
    <div id="haulBox" class="inset">
      <div class="lbl">Haul today</div>
      <div id="haul" class="t">0</div>
      <div id="bar"><div id="barFill"></div></div>
      <div id="pct" class="t"></div>
    </div>
    <div id="cmBox" class="inset">
      <div id="chipsBox"><div id="chips" class="t">0</div></div>
      <div class="x t">X</div>
      <div id="multBox"><div id="mult" class="t">0</div></div>
    </div>
    <div id="statBox" class="inset">
      <div class="cell"><div class="lbl">Casts</div><div id="casts" class="num c-blue t">5</div></div>
      <div class="cell"><div class="lbl">Depth</div><div id="depth" class="num c-cyan t">0m</div></div>
      <div class="cell wide"><div class="lbl">Line tension</div><div id="tension"><div id="tensionFill"></div><div id="tensionTxt" class="t">0 / 12kg</div></div></div>
    </div>
    <div id="moneyBox" class="inset"><div id="money" class="t">$4</div></div>
    <div id="leftBtns">
      <button id="infoBtn" class="b-red">Run<br>Info</button>
      <div id="speedBox" class="inset"><div class="lbl">Speed</div><div id="speedBtns"></div></div>
      <button id="optBtn" class="b-orange">Options</button>
    </div>
  </div>

  <div id="right" class="panel">
    <div class="rhead t">CREW <span id="crewCount" class="lbl"></span></div>
    <div id="crew"></div>
    <div class="rhead t">RIG <span id="rigCount" class="lbl"></span></div>
    <div id="rig"></div>
    <div id="rightBody"></div>
  </div>

  <div id="ov"></div>
  <div id="banner"></div>
  <div id="modal"></div>
  <div id="tip"></div>
</div></div>
<div id="crt"></div>
<script src="data.js"></script>
<script src="sprites.js"></script>
<script src="game.js"></script>
</body>
</html>
