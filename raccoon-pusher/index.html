<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raccoon Pusher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" />
  </head>
  <body>
    <header class="top-bar">
      <h1>RACCOON PUSHER</h1>
      <span id="machine-status" class="machine-status"></span>
      <span id="bag-status" class="bag-status"></span>
      <span id="won-status"></span>
      <span id="lost-status"></span>
    </header>
    <div class="play-area">
      <canvas id="machine-view"></canvas>
      <aside class="shop">
        <h2>RACCOON'S STASH</h2>
        <div id="shop-items" class="shop-items"></div>
        <h2>LOOT</h2>
        <div id="loot-list" class="loot-list"></div>
      </aside>
    </div>
    <p id="hint" class="hint"></p>
    <p id="note" class="note" hidden></p>
    <section id="prize-overlay" class="prize-overlay" hidden>
      <div class="prize-card">
        <h2 id="prize-title"></h2>
        <p id="prize-summary"></p>
        <button id="next-machine-button" type="button"></button>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
