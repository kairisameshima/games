<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chicken Dungeon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" />
  </head>
  <body>
    <header class="top-bar">
      <span id="flock-status"></span>
      <span id="depth-status"></span>
      <span id="gold-status"></span>
      <span id="egg-status"></span>
    </header>
    <div class="play-area">
      <main class="stage">
        <canvas id="dungeon-view"></canvas>
      </main>
      <aside class="coop-panel">
        <h2>UPGRADES</h2>
        <ol id="upgrade-list" class="upgrade-list"></ol>
        <h2>ANCESTRAL COOP</h2>
        <p id="yolk-status" class="yolk-status"></p>
        <ol id="ancestral-list" class="upgrade-list"></ol>
        <div id="dinner-bell-rules" class="dinner-bell-rules" hidden>
          <p>Dinner Bell recalls the flock when:</p>
          <label>every <input id="auto-recall-minutes" type="number" min="1" step="1" placeholder="off" /> min</label>
          <label>pouches hold <input id="auto-recall-gold" type="number" min="1" step="1" placeholder="off" /> gold</label>
          <label>flock HP is under <input id="auto-recall-hp" type="number" min="1" max="99" step="1" placeholder="off" /> %</label>
        </div>
        <button id="rite-button" type="button" class="rite-button">PERFORM THE RITE</button>
      </aside>
    </div>
    <footer class="action-bar">
      <button id="send-button" type="button">SEND</button>
      <button id="recall-button" type="button">HOLD TO RECALL</button>
      <span class="brood-control">
        BROOD
        <button id="brood-down-button" type="button" aria-label="Fewer brooding hens">−</button>
        <span id="brood-quota">0</span>
        <button id="brood-up-button" type="button" aria-label="More brooding hens">+</button>
      </span>
      <button id="speed-button" type="button">SPEED 1x</button>
    </footer>
    <ol id="event-log" class="event-log"></ol>
    <section id="rite-overlay" class="rite-overlay" hidden>
      <div class="rite-card">
        <h2>THE RITE OF THE GOLDEN YOLK</h2>
        <p id="rite-summary"></p>
        <h3>ROLL OF FEATHERS</h3>
        <ol id="roll-of-feathers" class="roll-of-feathers"></ol>
        <button id="begin-run-button" type="button">BEGIN RUN 2</button>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
