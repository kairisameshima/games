<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chicken Dungeon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" />
  </head>
  <body>
    <header class="top-bar">
      <span id="flock-status"></span>
      <span id="depth-status"></span>
      <span id="gold-status"></span>
      <span id="egg-status"></span>
    </header>
    <div class="play-area">
      <main class="stage">
        <canvas id="dungeon-view"></canvas>
      </main>
      <aside class="coop-panel">
        <h2>UPGRADES</h2>
        <ol id="upgrade-list" class="upgrade-list"></ol>
      </aside>
    </div>
    <footer class="action-bar">
      <button id="send-button" type="button">SEND</button>
      <button id="recall-button" type="button">HOLD TO RECALL</button>
      <span class="brood-control">
        BROOD
        <button id="brood-down-button" type="button" aria-label="Fewer brooding hens">−</button>
        <span id="brood-quota">0</span>
        <button id="brood-up-button" type="button" aria-label="More brooding hens">+</button>
      </span>
      <button id="speed-button" type="button">SPEED 1x</button>
      <button id="new-run-button" type="button" hidden>NEW RUN</button>
    </footer>
    <ol id="event-log" class="event-log"></ol>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
